<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="เข้าสู่ระบบ Bluecat Store - ระบบจัดการร้านค้าและคลังสินค้าออนไลน์">
  <title>เข้าสู่ระบบ | Bluecat Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --navy-700: #1e3a8a;
      --blue-600: #1d4ed8;
      --blue-500: #2563eb;
      --blue-100: #dbeafe;
      --blue-50: #eff6ff;

      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-input: #cbd5e1;

      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --success-border: #6ee7b7;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --error-border: #fca5a5;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.08);
      --focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.25);

      --font-sans: 'Noto Sans Thai', 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --container-max: 1140px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.65;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .skip-link {
      position: absolute;
      top: -100px;
      left: 1rem;
      background: var(--navy-900);
      color: #ffffff;
      padding: 0.6rem 1rem;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
      z-index: 999;
    }

    .skip-link:focus {
      top: 1rem;
      outline: none;
      box-shadow: var(--focus-ring);
    }

    a, button, input {
      font-family: inherit;
    }

    a:focus-visible, button:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin-inline: auto;
      padding-inline: 1.5rem;
      min-width: 0;
    }

    header, main, footer, section {
      width: 100%;
      min-width: 0;
    }

    /* ================= NAVBAR ================= */
    .site-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      gap: 1rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--navy-900);
      font-weight: 700;
      font-size: 1.2rem;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--blue-600);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      list-style: none;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .nav-link:hover {
      color: var(--blue-600);
      background-color: var(--blue-50);
    }

    .nav-link.active {
      color: var(--blue-600);
      background-color: var(--blue-50);
    }

    /* ================= LOGIN CARD ================= */
    .login-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 2.25rem 2rem;
    }

    .login-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .login-brand {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--blue-600);
      margin-bottom: 0.25rem;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy-900);
      margin-bottom: 0.3rem;
    }

    .login-subtitle {
      font-size: 0.92rem;
      color: var(--text-secondary);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-label {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--navy-900);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 0.72rem 0.95rem;
      font-size: 0.96rem;
      color: var(--navy-900);
      background-color: var(--bg-page);
      border: 1.5px solid var(--border-input);
      border-radius: var(--radius-sm);
      outline: none;
    }

    .form-input.has-toggle {
      padding-right: 4.5rem;
    }

    .form-input:focus {
      background-color: var(--bg-surface);
      border-color: var(--blue-500);
      box-shadow: var(--focus-ring);
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.5rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .password-toggle-btn:hover {
      background-color: var(--blue-50);
      color: var(--blue-600);
    }

    .checkbox-group {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.9rem;
      user-select: none;
    }

    .checkbox-input {
      width: 18px;
      height: 18px;
      accent-color: var(--blue-600);
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      padding: 0.82rem 1.25rem;
      background-color: var(--blue-600);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-login:hover {
      background-color: var(--navy-700);
    }

    .login-message {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .login-message.show {
      display: block;
    }

    .login-message.success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-border);
    }

    .login-message.error {
      background-color: var(--error-bg);
      color: var(--error-text);
      border-color: var(--error-border);
    }

    .demo-box {
      margin-top: 1.25rem;
      padding: 0.9rem 1rem;
      background-color: var(--blue-50);
      border: 1px solid var(--blue-100);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.65rem;
      font-size: 0.88rem;
    }

    .demo-info {
      color: var(--navy-900);
    }

    .demo-info code {
      font-weight: 700;
      background: #ffffff;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .btn-fill-demo {
      background: #ffffff;
      color: var(--blue-600);
      border: 1px solid var(--blue-500);
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-fill-demo:hover {
      background: var(--blue-600);
      color: #ffffff;
    }

    /* ================= FOOTER ================= */
    .site-footer {
      margin-top: auto;
      background: var(--navy-900);
      color: #cbd5e1;
      padding-block: 1.5rem;
      text-align: center;
      font-size: 0.88rem;
    }

    @media (max-width: 640px) {
      .container {
        padding-inline: 1rem;
      }

      .navbar {
        flex-wrap: wrap;
        padding-block: 0.75rem;
      }

      .navbar nav {
        order: 3;
        width: 100%;
      }

      .nav-links {
        width: 100%;
        justify-content: space-between;
        padding-top: 0.5rem;
        border-top: 1px solid var(--border-color);
      }

      .nav-link {
        padding: 0.45rem 0.65rem;
        font-size: 0.9rem;
      }

      .login-card {
        padding: 1.75rem 1.25rem;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">ข้ามไปยังฟอร์มเข้าสู่ระบบ</a>

  <!-- Navbar -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"></path>
            <path d="M12 12l8-4.5"></path>
            <path d="M12 12v9"></path>
            <path d="M12 12L4 7.5"></path>
          </svg>
        </span>
        <span>Bluecat Store</span>
      </a>

      <nav aria-label="เมนูหลัก">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">หน้าแรก</a></li>
          <li><a href="login.html" class="nav-link active" aria-current="page">เข้าสู่ระบบ</a></li>
          <li><a href="admin.html" class="nav-link">จัดการสินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="login-main">
    <section class="login-card" aria-labelledby="login-heading">
      <div class="login-header">
        <div class="login-brand">Bluecat Store</div>
        <h1 id="login-heading" class="login-title">เข้าสู่ระบบผู้ดูแล</h1>
        <p class="login-subtitle">กรอกชื่อผู้ใช้งานและรหัสผ่านเพื่อเข้าจัดการสินค้า</p>
      </div>

      <form id="loginForm" class="login-form" action="admin.html" method="post" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">ชื่อผู้ใช้งาน (Username)</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="เช่น admin"
              autocomplete="username"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="none"
              enterkeyhint="next"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">รหัสผ่าน (Password)</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input has-toggle"
              placeholder="กรอกรหัสผ่าน"
              autocomplete="current-password"
              enterkeyhint="done"
              required
            >
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-pressed="false">
              แสดงรหัส
            </button>
          </div>
        </div>

        <div>
          <label for="remember" class="checkbox-group">
            <input type="checkbox" id="remember" name="remember" class="checkbox-input" value="1">
            <span>จดจำการเข้าสู่ระบบ</span>
          </label>
        </div>

        <div id="loginMessage" class="login-message" role="status" aria-live="polite"></div>

        <button type="submit" id="loginBtn" class="btn-login">เข้าสู่ระบบ</button>
      </form>

      <div class="demo-box" aria-label="บัญชีทดลอง">
        <div class="demo-info">
          บัญชีทดลอง: <code>admin</code> / รหัสผ่าน: <code>1234</code>
        </div>
        <button type="button" id="fillDemoBtn" class="btn-fill-demo">กรอกข้อมูลทดลอง</button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    &copy; 2026 Bluecat Store &mdash; ระบบจัดการคลังสินค้า (Workshop #2)
  </footer>

  <script>
    (function () {
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const rememberCheckbox = document.getElementById('remember');
      const loginMessage = document.getElementById('loginMessage');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const fillDemoBtn = document.getElementById('fillDemoBtn');

      const validAccounts = {
        admin: ['1234', 'admin123', 'admin', 'password'],
        bluecat: ['1234', 'bluecat123'],
        user: ['1234']
      };

      try {
        const savedUser = localStorage.getItem('bluecat_remember_user');
        if (savedUser) {
          usernameInput.value = savedUser;
          rememberCheckbox.checked = true;
        }
      } catch (e) {}

      function showMessage(type, html) {
        loginMessage.className = 'login-message show ' + type;
        loginMessage.innerHTML = html;
      }

      togglePasswordBtn.addEventListener('click', function () {
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        togglePasswordBtn.textContent = isHidden ? 'ซ่อนรหัส' : 'แสดงรหัส';
        togglePasswordBtn.setAttribute('aria-pressed', String(isHidden));
      });

      fillDemoBtn.addEventListener('click', function () {
        usernameInput.value = 'admin';
        passwordInput.value = '1234';
        rememberCheckbox.checked = true;
        showMessage('success', 'กรอกข้อมูลทดลองแล้ว กดปุ่ม <strong>เข้าสู่ระบบ</strong> ได้เลย');
      });

      loginForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const user = usernameInput.value.trim();
        const pass = passwordInput.value.trim();

        if (!user || !pass) {
          showMessage('error', 'กรุณากรอกชื่อผู้ใช้งานและรหัสผ่านให้ครบถ้วน');
          return;
        }

        const allowed = validAccounts[user.toLowerCase()];
        if (Array.isArray(allowed) && allowed.includes(pass)) {
          try {
            if (rememberCheckbox.checked) {
              localStorage.setItem('bluecat_remember_user', user);
            } else {
              localStorage.removeItem('bluecat_remember_user');
            }
          } catch (e) {}

          showMessage('success', 'เข้าสู่ระบบสำเร็จ กำลังพาไปหน้าจัดการสินค้า...');
          setTimeout(function () {
            window.location.href = 'admin.html';
          }, 900);
        } else {
          showMessage('error', 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง (บัญชีทดลอง: admin / 1234)');
        }
      });
    })();
  </script>
</body>
</html>
